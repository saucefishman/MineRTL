[project]
name = "minecraft-v"
version = "0.1.0"
description = "MineRTL: synthesize Verilog into Minecraft redstone circuits (.litematic)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.3",
    "litemapy>=0.11.0b0",
    "numpy>=2.4.4",
    "scipy>=1.18.1",
    "networkx>=3.7",
]

[project.urls]
Repository = "https://github.com/saucefishman/MineRTL"

[build-system]
requires = ["setuptools>=77", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Rebuild the Cython A* kernel whenever its source changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "minecraft_v/**/*.pyx" }]

[tool.setuptools.packages.find]
include = ["minecraft_v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "Cython>=3.0",
    "nbtlib",
]
